# LOCAL DEVELOPMENT ONLY. Every port is bound to 127.0.0.1.
# This file runs the Vite dev server, which must never be reachable from a
# network. For QA or any shared server use docker-compose.qa.yml.
name: rsvp-dev

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rsvp}
      POSTGRES_USER: ${POSTGRES_USER:-rsvp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rsvp}
    ports:
      - "127.0.0.1:${PG_PORT:-5433}:5432"   # this machine only
    volumes:
      - rsvp_pgdata_dev:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro   # ← add this line
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rsvp} -d ${POSTGRES_DB:-rsvp}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  server:
    image: gradle:8.10.0-jdk21
    working_dir: /home/gradle/project
    volumes:
      - ./server:/home/gradle/project
      - gradle-cache:/home/gradle/.gradle        # speed up rebuilds
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-rsvp}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-rsvp}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-rsvp}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      WEBINAR_DISPLAY_ZONE: ${WEBINAR_DISPLAY_ZONE:-America/New_York}
      ZOOM_ENABLED: ${ZOOM_ENABLED:-false}
      ZOOM_ACCOUNT_ID: ${ZOOM_ACCOUNT_ID:-}
      ZOOM_CLIENT_ID: ${ZOOM_CLIENT_ID:-}
      ZOOM_CLIENT_SECRET: ${ZOOM_CLIENT_SECRET:-}
      ZOOM_IMPORT_USER_ID: ${ZOOM_IMPORT_USER_ID:-me}
      ZOOM_WEBINAR_IMPORT_USER_ID: ${ZOOM_WEBINAR_IMPORT_USER_ID:-}
      WEBINAR_JOIN_WINDOW_BEFORE_MIN: ${WEBINAR_JOIN_WINDOW_BEFORE_MIN:-10}
      WEBINAR_JOIN_WINDOW_AFTER_MIN: ${WEBINAR_JOIN_WINDOW_AFTER_MIN:-15}
      ZOOM_OAUTH_URL: ${ZOOM_OAUTH_URL:-https://zoom.us/oauth/token}
      ZOOM_BASE_URL: ${ZOOM_BASE_URL:-https://api.zoom.us}
      ZOOM_DEFAULT_HOST_NAME: ${ZOOM_DEFAULT_HOST_NAME:-FMB}
    command: sh -lc "./gradlew bootRun --no-daemon"
    ports:
      - "127.0.0.1:8080:8080"               # this machine only
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules       # keep deps inside container
    environment:
      VITE_API_TARGET: http://server:8080
    command: sh -lc "npm install && npm run dev -- --host"
    ports:
      - "127.0.0.1:5173:5173"               # this machine only
    depends_on:
      - server

volumes:
  rsvp_pgdata_dev:
  gradle-cache:
  web-node-modules:
